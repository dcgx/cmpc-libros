services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cmpc
      POSTGRES_PASSWORD: cmpc
      POSTGRES_DB: cmpc_libros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmpc -d cmpc_libros"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://cmpc:cmpc@db:5432/cmpc_libros?schema=public
      JWT_SECRET: change-me-in-production-cmpc-libros
      JWT_EXPIRES_IN: 8h
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      SEED_ON_EMPTY: "true"
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
